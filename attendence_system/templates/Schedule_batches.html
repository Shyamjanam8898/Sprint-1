{% extends "layout.html" %}

{% block body %}
<div class="container-fluid">
  <div class="main-content" style="max-width:700px; margin:auto;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">Schedule - Batches</h3>
        <p class="small-muted">Click a class to view its schedules</p>
      </div>
      <div>
        {% if session.get('role') in ['admin','root'] %}
            <a href="{{ url_for('add_schedule') }}" class="btn btn-primary">Add Schedule</a>
        {% endif %}
        </div>
    </div>
    <div class="list-group mb-3">
      {% for cls, count in classes %}
        <a href="{{ url_for('show_schedule', Standard=cls) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
          <div>
            <span class="fw-bold">{{ cls }}</span>
          </div>
          <span class="badge bg-secondary rounded-pill">{{ count }}</span>
        </a>
      {% else %}
        <div class="list-group-item py-3">No batches found.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
