{% extends "layout.html" %}

{% block body %}
<div class="container-fluid">
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Students in Standard {{ Standard }}</h3>
            <a href="{{ url_for('standard') }}" class="btn btn-secondary">Back to Standards</a>
        </div>

        <form method="POST" action="">
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width:120px">ID</th>
                            <th>Name</th>
                            <th style="width:360px">Attendance</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in Students %}
                        <tr>
                            <td class="fw-semibold">{{ student.Student_id }}</td>
                            <td>{{ student.Student_name }}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="btn-group me-3" role="group">
                                        <input type="radio" class="btn-check" name="attendance_{{ student.Student_id }}" id="present_{{ student.Student_id }}" value="Present" autocomplete="off">
                                        <label class="btn btn-outline-success" for="present_{{ student.Student_id }}">Present</label>

                                        <input type="radio" class="btn-check" name="attendance_{{ student.Student_id }}" id="absent_{{ student.Student_id }}" value="Absent" autocomplete="off">
                                        <label class="btn btn-outline-danger" for="absent_{{ student.Student_id }}">Absent</label>
                                    </div>
                                    <input type="text" class="form-control" style="max-width:280px;" name="reason_{{ student.Student_id }}" placeholder="Reason for absence">
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Submit Attendance</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
