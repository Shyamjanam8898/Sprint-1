{% extends "layout.html" %}

{% block body %}
<div class="container-fluid">
    <div class="main-content" style="max-width:700px; margin:auto;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="bi bi-plus-circle"></i> Add Exam Schedule</h3>
            <a href="{{ url_for('exam_batches') }}" class="btn btn-outline-secondary btn-sm">Back</a>
        </div>

        {% if classes and classes|length > 0 %}
        <form method="POST" action="{{ url_for('add_exam') }}">
            <div class="mb-3">
                <label for="standard" class="form-label">Class/Standard <span class="text-danger">*</span></label>
                <select class="form-select" id="standard" name="standard" required>
                    <option value="">-- Select Class --</option>
                    {% for cls in classes %}
                        <option value="{{ cls }}">{{ cls }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="subject" name="subject" placeholder="e.g., Mathematics, English" required>
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Exam Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="start_hour" class="form-label">Start Time - Hour <span class="text-danger">*</span></label>
                    <select class="form-select" id="start_hour" name="start_hour" required>
                        <option value="">Select Hour</option>
                        {% for h in range(1, 13) %}
                            <option value="{{ '%02d'|format(h) }}">{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="start_minute" class="form-label">Minute <span class="text-danger">*</span></label>
                    <select class="form-select" id="start_minute" name="start_minute" required>
                        <option value="">Select Minute</option>
                        {% for m in range(0, 60, 5) %}
                            <option value="{{ '%02d'|format(m) }}">{{ '%02d'|format(m) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label for="start_period" class="form-label">Period <span class="text-danger">*</span></label>
                    <select class="form-select" id="start_period" name="start_period" required>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="end_hour" class="form-label">End Time - Hour <span class="text-danger">*</span></label>
                    <select class="form-select" id="end_hour" name="end_hour" required>
                        <option value="">Select Hour</option>
                        {% for h in range(1, 13) %}
                            <option value="{{ '%02d'|format(h) }}">{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="end_minute" class="form-label">Minute <span class="text-danger">*</span></label>
                    <select class="form-select" id="end_minute" name="end_minute" required>
                        <option value="">Select Minute</option>
                        {% for m in range(0, 60, 5) %}
                            <option value="{{ '%02d'|format(m) }}">{{ '%02d'|format(m) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label for="end_period" class="form-label">Period <span class="text-danger">*</span></label>
                    <select class="form-select" id="end_period" name="end_period" required>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="total_marks" class="form-label">Total Marks</label>
                <input type="number" class="form-control" id="total_marks" name="total_marks" placeholder="e.g., 100" min="0">
            </div>

            <div class="mb-3">
                <label for="professor_name" class="form-label">Professor/Invigilator <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="professor_name" name="professor_name" placeholder="e.g., Dr. Smith" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Add Exam
                </button>
            </div>
        </form>
        {% else %}
            <div class="alert alert-info">
                No classes found. Add at least one student or class before creating an exam.
                <a href="{{ url_for('Student_reg') }}">Register a student</a> or create classes via student registrations.
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
