{% extends "layout.html" %}

{% block body %}
<div class="container-fluid">
    <div class="main-content" style="max-width:700px; margin:auto;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="bi bi-pencil-square"></i> Edit Exam Schedule</h3>
            <a href="{{ url_for('exam_schedules', Standard=exam.Standard) }}" class="btn btn-outline-secondary btn-sm">Back</a>
        </div>

        <form method="POST" action="{{ url_for('edit_exam', exam_id=exam.Exam_id) }}">
            <div class="mb-3">
                <label class="form-label">Class/Standard</label>
                <input type="text" class="form-control" value="{{ exam.Standard }}" disabled>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="subject" name="subject" value="{{ exam.Subject }}" required>
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Exam Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="date" name="date" value="{{ exam.Date }}" required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="start_hour" class="form-label">Start Time - Hour <span class="text-danger">*</span></label>
                    <select class="form-select" id="start_hour" name="start_hour" required>
                        <option value="">Select Hour</option>
                        {% for h in range(1, 13) %}
                            <option value="{{ '%02d'|format(h) }}" {% if exam.start_hour == '%02d'|format(h) %}selected{% endif %}>{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="start_minute" class="form-label">Minute <span class="text-danger">*</span></label>
                    <select class="form-select" id="start_minute" name="start_minute" required>
                        <option value="">Select Minute</option>
                        {% for m in range(0, 60, 5) %}
                            <option value="{{ '%02d'|format(m) }}" {% if exam.start_minute == '%02d'|format(m) %}selected{% endif %}>{{ '%02d'|format(m) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label for="start_period" class="form-label">Period <span class="text-danger">*</span></label>
                    <select class="form-select" id="start_period" name="start_period" required>
                        <option value="AM" {% if exam.start_period == 'AM' %}selected{% endif %}>AM</option>
                        <option value="PM" {% if exam.start_period == 'PM' %}selected{% endif %}>PM</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="end_hour" class="form-label">End Time - Hour <span class="text-danger">*</span></label>
                    <select class="form-select" id="end_hour" name="end_hour" required>
                        <option value="">Select Hour</option>
                        {% for h in range(1, 13) %}
                            <option value="{{ '%02d'|format(h) }}" {% if exam.end_hour == '%02d'|format(h) %}selected{% endif %}>{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="end_minute" class="form-label">Minute <span class="text-danger">*</span></label>
                    <select class="form-select" id="end_minute" name="end_minute" required>
                        <option value="">Select Minute</option>
                        {% for m in range(0, 60, 5) %}
                            <option value="{{ '%02d'|format(m) }}" {% if exam.end_minute == '%02d'|format(m) %}selected{% endif %}>{{ '%02d'|format(m) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label for="end_period" class="form-label">Period <span class="text-danger">*</span></label>
                    <select class="form-select" id="end_period" name="end_period" required>
                        <option value="AM" {% if exam.end_period == 'AM' %}selected{% endif %}>AM</option>
                        <option value="PM" {% if exam.end_period == 'PM' %}selected{% endif %}>PM</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="total_marks" class="form-label">Total Marks</label>
                <input type="number" class="form-control" id="total_marks" name="total_marks" value="{{ exam.Total_marks if exam.Total_marks else '' }}" min="0">
            </div>

            <div class="mb-3">
                <label for="professor_name" class="form-label">Professor/Invigilator <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="professor_name" name="professor_name" value="{{ exam.Professor_name }}" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-check-circle"></i> Update Exam
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
