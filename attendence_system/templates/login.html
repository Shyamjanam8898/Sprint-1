<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyEducationPortal - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(120deg, #4facfe 0%, #00f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(44,62,80,0.13);
      padding: 38px 32px 28px 32px;
      max-width: 370px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }
    .login-card .avatar {
      width: 70px;
      height: 70px;
      background: #eaf6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -60px auto 18px auto;
      box-shadow: 0 2px 8px rgba(44,62,80,0.08);
      font-size: 2.5rem;
      color: #4facfe;
    }
    .login-card h2 {
      font-weight: 700;
      color: #007bff;
      margin-bottom: 18px;
      letter-spacing: 1px;
      text-align: center;
    }
    .form-control, .form-select {
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1.05rem;
      margin-bottom: 16px;
      border: 1px solid #e3e3e3;
      background: #f8faff;
      transition: border 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #4facfe;
      box-shadow: 0 0 0 2px #4facfe22;
      background: #fff;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(44,62,80,0.07);
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: linear-gradient(90deg, #00c6ff 0%, #4facfe 100%);
    }
    .error {
      color: #e74c3c;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 500;
    }
    @media (max-width: 500px) {
      .login-card {
        padding: 28px 8px 18px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="avatar">
      <i class="bi bi-person-circle"></i>
    </div>
    <h2>Sign In</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST" autocomplete="off">
      <input type="text" name="username" class="form-control" placeholder="Username" required autofocus autocomplete="off">
      <input type="password" name="password" class="form-control" placeholder="Password" required autocomplete="off">
      <!-- Role will be auto-detected: only username & password required -->
      <button type="submit" class="login-btn mt-2">Login <i class="bi bi-box-arrow-in-right ms-1"></i></button>
    </form>
  </div>
</body>
</html>
